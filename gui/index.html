<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>类Rust编译器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.63.0/codemirror.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- 顶部标题栏 -->
    <header class="page-header" aria-label="应用标题栏">
      <div class="header-left">
        <div class="app-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#c2540a" stroke-width="2" stroke-linejoin="round" />
            <path d="M2 17L12 22L22 17" stroke="#c2540a" stroke-width="2" stroke-linejoin="round" />
            <path d="M2 12L12 17L22 12" stroke="#c2540a" stroke-width="2" stroke-linejoin="round" />
          </svg>
        </div>
        <span class="app-title">类 Rust 编译器</span>
        <span class="app-version" id="app-version">v 0.1.0</span>
      </div>
      <div class="header-center">
        <span id="environment-info" class="env-info"></span>
      </div>
    </header>

    <!-- 主体区域 -->
    <main class="container">
      <!-- 左侧编辑器面板 -->
      <div class="editor-panel">
        <div class="panel-toolbar">
          <div class="panel-toolbar-left">
            <svg class="panel-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M9.5 1a.5.5 0 0 1 .5.5v1h1.5A1.5 1.5 0 0 1 13 4v9a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 13V4a1.5 1.5 0 0 1 1.5-1.5H6v-1a.5.5 0 0 1 1 0v1h2v-1a.5.5 0 0 1 .5-.5z" />
            </svg>
            <span class="panel-label">源代码</span>
            <span class="file-chip">main.rs</span>
          </div>
          <div class="panel-toolbar-right">
            <span class="lang-badge">Rust-like</span>
          </div>
        </div>
        <div id="editor"></div>
      </div>

      <!-- 可拖拽分割线 -->
      <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="拖拽调整面板宽度"></div>

      <!-- 右侧分析结果面板 -->
      <div class="tabs-container">
        <div class="tabs" role="tablist" aria-label="编译分析结果">
          <button class="tab active" type="button" role="tab" id="btn-tab1" data-tab="tab1" aria-selected="true" aria-controls="tab1"><span class="tab-icon tab-icon-table" aria-hidden="true"></span>GOTO 表</button>
          <button class="tab" type="button" role="tab" id="btn-tab2" data-tab="tab2" aria-selected="false" aria-controls="tab2"><span class="tab-icon tab-icon-table" aria-hidden="true"></span>ACTION 表</button>
          <button class="tab" type="button" role="tab" id="btn-tab3" data-tab="tab3" aria-selected="false" aria-controls="tab3"><span class="tab-icon tab-icon-process" aria-hidden="true"></span>移进-规约</button>
          <button class="tab" type="button" role="tab" id="btn-tab4" data-tab="tab4" aria-selected="false" aria-controls="tab4"><span class="tab-icon tab-icon-tree" aria-hidden="true"></span>语法树</button>
          <button class="tab" type="button" role="tab" id="btn-tab5" data-tab="tab5" aria-selected="false" aria-controls="tab5"><span class="tab-icon tab-icon-code" aria-hidden="true"></span>中间代码</button>
          <button class="tab" type="button" role="tab" id="btn-tab6" data-tab="tab6" aria-selected="false" aria-controls="tab6"><span class="tab-icon tab-icon-target" aria-hidden="true"></span>目标代码</button>
        </div>

        <div class="tab-content" id="tab1" role="tabpanel" aria-labelledby="btn-tab1" tabindex="0">
          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr class="table-headers" id="goto-table-headers"></tr>
              </thead>
              <tbody class="table-body" id="goto-table-body"></tbody>
            </table>
          </div>
        </div>
        <div class="tab-content hidden" id="tab2" role="tabpanel" aria-labelledby="btn-tab2" tabindex="0">
          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr class="table-headers" id="action-table-headers"></tr>
              </thead>
              <tbody class="table-body" id="action-table-body"></tbody>
            </table>
          </div>
        </div>
        <div class="tab-content hidden" id="tab3" role="tabpanel" aria-labelledby="btn-tab3" tabindex="0">
          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr class="table-headers" id="reduce-table-headers"></tr>
              </thead>
              <tbody class="table-body" id="reduce-table-body"></tbody>
            </table>
          </div>
        </div>
        <div class="tab-content hidden" id="tab4" role="tabpanel" aria-labelledby="btn-tab4" tabindex="0">
          <div id="syntax-tree-container"></div>
        </div>
        <div class="tab-content hidden" id="tab5" role="tabpanel" aria-labelledby="btn-tab5" tabindex="0">
          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr class="table-headers" id="quadruple-table-headers"></tr>
              </thead>
              <tbody class="table-body" id="quadruple-table-body"></tbody>
            </table>
          </div>
        </div>
        <div class="tab-content hidden" id="tab6" role="tabpanel" aria-labelledby="btn-tab6" tabindex="0">
          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr class="table-headers" id="target-code-table-headers"></tr>
              </thead>
              <tbody class="table-body" id="target-code-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- 底部状态栏 -->
    <footer class="status-bar" aria-label="状态栏">
      <div class="status-left">
        <span class="status-item">
          <span class="status-dot status-dot-ok"></span>
          LR(1) 分析器
        </span>
        <span class="status-sep">|</span>
        <span class="status-item">词法 · 语法 · 语义 · 代码生成</span>
      </div>
      <div class="status-right">
        <span id="cursor-pos" class="status-item" aria-live="polite" aria-label="光标位置">行 1  列 1</span>
        <span class="status-sep">|</span>
        <span class="status-item">类 Rust 语言编译器</span>
      </div>
    </footer>

    <script src="config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.63.0/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.63.0/addon/display/placeholder.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
